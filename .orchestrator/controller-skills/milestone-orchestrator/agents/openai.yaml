interface:
  display_name: "Milestone Orchestrator"
  short_description: "Run the chase-sets delivery loop: lanes, queue, deploys"
  default_prompt: "Use $milestone-orchestrator as a standing goal: write the host identity record first; then run delivery cycles, keep the merge queue fed, inject review-contract/v2 and quality-v2 into every review, and bind ordinary review authority only to the requested PR's exact head. Prefer landing-preflight/v1 Apply; when a controller-only refusal hits a landing-authority-complete product PR, directly enqueue once at its exact node/head with jump:false and record refusal plus actual result in one landing-stall row. Reconcile unknown responses before retry; never mutate a nonqualified PR. Read failing logs yourself and dispatch no diagnosis lane; write lifecycle rows only; route fixable blockers directly to repair, using the ancestor BLOCK_FIXABLE head as the repair battery baseline when its named findings validate. Verify deploys green and run the staging representative refresh in-cluster when the Buy Now probe finds no canary. Dispatch only exact model versions from $model-routing; deprecated Opus 4.8 and unversioned aliases are never selectable."
